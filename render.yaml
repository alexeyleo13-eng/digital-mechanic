services:
  - type: web
    name: digital-mechanic
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /api/config
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: LLM_FALLBACK_MODELS
        value: gemini-3.7-flash,gemini-3.5-flash-lite
      - key: LLM_EFFORT
        value: medium
      - key: LLM_API_KEY
        sync: false
