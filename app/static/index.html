<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181f">
<title>Цифровой механик</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f2a900'/%3E%3Cpath d='M9 22l6-6m2-2l6-6M10 10a4 4 0 0 0 5 5l7 7a2 2 0 0 0 3-3l-7-7a4 4 0 0 0-5-5l2 2-1 2-2 1z' stroke='%2314181f' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">⚙</span><span>Цифровой механик</span></div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="mechanic" role="tab">Механик</button>
    <button class="tab" data-view="fleet" role="tab">Парк</button>
  </nav>
  <span id="mode" class="mode" title="Режим агента"></span>
</header>

<main>
  <section id="view-mechanic" class="view active">
    <div class="vehicle-bar">
      <button id="vehicle-picker" class="picker" aria-haspopup="dialog">
        <span class="dot" id="v-dot"></span>
        <span class="picker-main"><b id="v-plate">Выберите машину</b><small id="v-sub">50 ТС в парке</small></span>
        <span class="chev">▾</span>
      </button>
      <button id="v-trend" class="trend" title="История проверок" hidden></button>
    </div>
    <div class="actions">
      <button id="btn-diagnose" class="primary" disabled>Получить результат диагностики</button>
      <select id="session-select" class="session" title="Проверка" disabled></select>
    </div>
    <div id="chat" class="chat" aria-live="polite">
      <div class="empty" id="empty">
        <p class="big">Выберите машину и получите результат акустической проверки.</p>
        <p>Агент объяснит отклонение, найдёт проверки и нормативы в руководстве на двигатель этой машины со ссылкой на страницу и оформит заявку на дефектовку.</p>
        <p class="mode-line">Режим агента: <span id="mode2">…</span></p>
      </div>
    </div>
    <div class="composer">
      <div id="chips" class="chips"></div>
      <form id="form" class="input-row">
        <textarea id="input" rows="1" placeholder="Спросите механика…" disabled></textarea>
        <button id="send" class="send" aria-label="Отправить" disabled>➤</button>
      </form>
    </div>
  </section>

  <section id="view-fleet" class="view">
    <div class="fleet-head">
      <h1>Состояние парка</h1>
      <div class="tiles" id="tiles"></div>
      <div class="filters" id="filters"></div>
    </div>
    <ul id="fleet-list" class="fleet-list"></ul>
  </section>
</main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button class="icon" data-close aria-label="Закрыть">✕</button></div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
